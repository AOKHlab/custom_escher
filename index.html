<!DOCTYPE html>
<html>
<title>Syn3 Genome</title>

<!-- Escher -->
<script src="../escher.min.js"></script>

<!-- Use extra d3 features -->
<script src="https://d3js.org/d3.v7.min.js"></script>
<!-- vonoroi map dependencies -->
<script src="https://rawcdn.githack.com/Kcnarf/d3-weighted-voronoi/v1.1.3/build/d3-weighted-voronoi.js"></script>
<script src="https://rawcdn.githack.com/Kcnarf/d3-voronoi-map/v2.1.1/build/d3-voronoi-map.js"></script>
<script src="https://rawcdn.githack.com/Kcnarf/d3-voronoi-treemap/v1.1.2/build/d3-voronoi-treemap.js"></script>

<meta charset="utf-8" />
<link rel="stylesheet" href="main.css" />

<body>
  <div id="map-controls">
    <label>Size
      <select id="size-field"></select>
    </label>
    <label>Shading
      <select id="shading-field"></select>
    </label>
    <div id='Filtering'>
      <label>Property
        <select id="property"></select>
      </label>
      <label>Operator
        <select id="operator"></select>
      </label>
      <label>Target
        <input id="target"></input>
      </label>
      <button id="add-filter">Add Filter</button>
    </div>
    <button id="redraw-map">Redraw map</button>
  </div>
  <div id="legend">
    <div id="legend-head"></div>
  </div>
  <div id="voronoiTreemap"></div>
  <div id="gene_info"></div>
</body>

<!-- JS -->
<script src="main.js"></script>

</html>
